name: Iris ML Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train Iris model
        run: python train_model.py

      - name: Run accuracy quality gate
        run: python quality_gate.py

      - name: Run tests
        run: python -m pytest test_app.py test_ml_pipeline.py -v

      - name: Prepare Docker release artifact
        run: |
          mkdir release_candidate
          cp Iris.csv train_model.py app.py quality_gate.py release_candidate/
          cp requirements.txt Dockerfile .dockerignore release_candidate/
          cp iris_model.pkl metrics.json release_candidate/

      - name: Upload Docker release artifact
        uses: actions/upload-artifact@v4
        with:
          name: iris-docker-release
          path: release_candidate/
          if-no-files-found: error
